name: NEXORA Enterprise CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    name: Backend Tests & Lint (PostgreSQL 16)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nexora_owner
          POSTGRES_PASSWORD: nexora_owner_secret
          POSTGRES_DB: nexora_enterprise_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt
      - name: Lint backend with ruff
        run: ruff check backend/app backend/tests
      - name: Run PostgreSQL RLS, Auth, Concurrency & E2E tests
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "5432"
          POSTGRES_USER: nexora_owner
          POSTGRES_PASSWORD: nexora_owner_secret
          POSTGRES_DB: nexora_enterprise
          POSTGRES_TEST_DB: nexora_enterprise_test
        run: |
          cd backend
          python scripts/setup_postgres.py
          pytest -v

  frontend:
    name: Frontend Tests, TypeCheck & Vite Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: cd frontend && npm ci
      - name: Run Vitest component & route tests
        run: cd frontend && npm test
      - name: Run TypeScript typecheck & production build
        run: cd frontend && npm run build
