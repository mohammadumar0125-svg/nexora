services:
  db:
    image: postgres:16
    container_name: nexora_pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nexora_enterprise}
      POSTGRES_USER: ${POSTGRES_USER:-nexora_owner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nexora_owner_secret}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nexora_owner} -d ${POSTGRES_DB:-nexora_enterprise}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nexora_app
    restart: unless-stopped
    environment:
      APP_ENV: development
      PORT: "8000"
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-nexora_enterprise}
      POSTGRES_USER: ${POSTGRES_USER:-nexora_owner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nexora_owner_secret}
      DB_API_USER: ${DB_API_USER:-api_role}
      DB_API_PASSWORD: ${DB_API_PASSWORD:-api_secret_pass}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    ports:
      - "8000:8000"
    command: sh -c "python3 backend/scripts/setup_postgres.py && python3 backend/app/seed_enterprise.py && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
