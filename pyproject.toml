[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = [
    "B008", # Do not perform function call `Depends` in argument defaults
    "E501", # Line too long
    "E741", # Ambiguous variable name
    "E722", # Bare except
    "F841", # Unused local variable
]

[tool.mypy]
python_version = "3.9"
ignore_missing_imports = true
warn_unused_ignores = false
disallow_untyped_defs = false
